<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>How was the WC?</title>
  <meta name="description" content="Meld vieze wc's op kantoor, scoor punten en win de Gouden Borstel.">
  <meta name="theme-color" content="#0f8b8d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="How was the WC?">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><div class="loading">Even de pot checken…</div></div>
  <div id="sheet"></div>
  <div id="lightbox"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
  <script>
    // Vangnet: als de app na 8 seconden nog niet gestart is, uitleg tonen.
    setTimeout(function () {
      var l = document.querySelector('#app > .loading');
      if (!l) return;
      l.innerHTML = location.protocol === 'file:'
        ? 'De app werkt niet als je index.html dubbelklikt.<br>Open hem via je GitHub-link (https://…github.io/…).'
        : 'De app start niet. Staan alle bestanden (ook app.js en config.js) los in de repository, niet in een submap?<br><br><button onclick="location.reload()">Opnieuw proberen</button>';
    }, 8000);
  </script>
</body>
</html>
